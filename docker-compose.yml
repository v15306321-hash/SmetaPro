# Production-стек: PostgreSQL + веб (сайт, кабинет, админка, API) + бот (Telegram + фоновые задачи).
# Перед запуском: cp .env.example .env и заполнить значения. HTTPS — через nginx (deploy/nginx.conf).
services:
  db:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: furniture
      POSTGRES_USER: furniture
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U furniture -d furniture"]
      interval: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://furniture:${POSTGRES_PASSWORD}@db:5432/furniture
      STORAGE_DIR: /app/storage
    # миграции применяются при каждом старте (идемпотентно), затем запускается один процесс uvicorn
    command: sh -c "alembic upgrade head && python -m app.cli seed && uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=*"
    volumes:
      - storage:/app/storage
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://furniture:${POSTGRES_PASSWORD}@db:5432/furniture
      STORAGE_DIR: /app/storage
    command: python -m app.bot.runner
    volumes:
      - storage:/app/storage   # PDF-сметы и чеки общие для бота и сайта
    depends_on:
      web:
        condition: service_started

volumes:
  pgdata:
  storage:
