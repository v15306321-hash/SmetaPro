# Render Blueprint — БЕСПЛАТНЫЙ вариант: веб-сервис Render Free + база Neon Free (создаётся отдельно).
# Инструкция: docs/RENDER.md. Платный вариант (без засыпания): deploy/render.paid.yaml.
# Значения с sync: false Render спросит при создании — в репозитории их нет.
services:
  - type: web
    name: furniture-estimate
    runtime: python
    plan: free
    region: frankfurt          # ближайший к Узбекистану; базу Neon создайте тоже во Франкфурте
    branch: main
    buildCommand: pip install -r requirements.txt
    # миграции и справочники применяются при каждом запуске (идемпотентно), затем стартует сервер
    startCommand: alembic upgrade head && python -m app.cli seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips=*
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: APP_ENV
        value: production
      - key: BOT_MODE
        value: webhook          # бот работает внутри веб-сервиса
      - key: DB_NULL_POOL
        value: "true"           # не держать соединения — база Neon может засыпать
      - key: JOBS_INTERVAL_SECONDS
        value: "3600"           # напоминания о подписке — раз в час
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL       # строка подключения из Neon
        sync: false
      - key: BASE_URL           # https://<имя-сервиса>.onrender.com
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: BOT_USERNAME
        sync: false
      - key: SUPERADMIN_TELEGRAM_IDS
        sync: false
      - key: SUPPORT_TELEGRAM
        sync: false
