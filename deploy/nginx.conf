# /etc/nginx/sites-available/furniture-estimate
# Сертификат: sudo certbot --nginx -d example.uz -d www.example.uz
server {
    listen 80;
    server_name example.uz www.example.uz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name example.uz www.example.uz;

    ssl_certificate     /etc/letsencrypt/live/example.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.uz/privkey.pem;

    client_max_body_size 10m;          # чеки и логотипы до 8 МБ

    # Ограничение частоты для входа и API на уровне nginx (дополняет ограничение в приложении)
    limit_req_zone $binary_remote_addr zone=auth:10m rate=30r/m;

    location /auth/ {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /static/ {
        proxy_pass http://127.0.0.1:8000;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
